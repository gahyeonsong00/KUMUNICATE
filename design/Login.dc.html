<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경희대 키우기 로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Galmuri11';src:url(../assets/fonts/Galmuri11.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Galmuri11';src:url(../assets/fonts/Galmuri11-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{margin:0}
a{color:#7E2219}a:hover{color:#5E1A13}
*{-webkit-font-smoothing:none}
.crisp{image-rendering:pixelated}
.panel{background:#F6EBCF;border:3px solid #3A2617;box-shadow:inset 0 0 0 2px #FFF7E2,inset 0 0 0 4px #D9C08E,4px 4px 0 rgba(58,38,23,.45)}
.plate{background:#8A5A33;color:#FFF3D6;border:3px solid #3A2617;box-shadow:inset 0 2px 0 #B07A48,inset 0 -3px 0 #5E3B20}
.btn{background:#B23A2E;color:#FFF6E6;border:3px solid #3A2617;box-shadow:inset 0 3px 0 #D9644F,inset 0 -4px 0 #7E2219,3px 3px 0 rgba(58,38,23,.45);cursor:pointer;text-decoration:none}
.btn2{background:#6E9A34;color:#FFFBEA;border:3px solid #3A2617;box-shadow:inset 0 3px 0 #94BF4E,inset 0 -4px 0 #4A6D20,3px 3px 0 rgba(58,38,23,.45);cursor:pointer;text-decoration:none}
.btn3{background:#EAD9AE;color:#3A2617;border:3px solid #3A2617;box-shadow:inset 0 3px 0 #FFF4D2,inset 0 -4px 0 #C2A66C,3px 3px 0 rgba(58,38,23,.45);cursor:pointer;text-decoration:none}
.btn:active,.btn2:active,.btn3:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.15)}
.slot{background:#E9D9B0;border:3px solid #3A2617;box-shadow:inset 3px 3px 0 #C9AF77}
input:focus,textarea:focus{outline:3px solid #E8B64A;outline-offset:0}
@media (prefers-reduced-motion: no-preference){
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.walk{transition:left .6s steps(6),top .6s steps(6)}
.bar{width:0;animation:fill 1.6s steps(8) forwards}
@keyframes fill{to{width:100%}}
}
@media (prefers-reduced-motion: reduce){.bar{width:100%}}
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'Galmuri11', monospace; color: #3A2617; background: #6F8F2C">
  <img src="../assets/campus_map.jpg" alt="" class="crisp" style="position: absolute; left: -210px; top: -120px; width: 800px; height: 1000px">
  <div style="position: absolute; inset: 0; background: rgba(58,38,23,.28)"></div>
  <div style="position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 22px; gap: 16px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div class="plate" style="padding: 10px 18px; text-align: center">
        <h1 style="margin: 0; font-weight: 700; font-size: 32px; letter-spacing: 1px; color: #FFF3D6; text-shadow: 3px 3px 0 #3A2617">경희대 키우기</h1>
      </div>
      <img src="../assets/mascot_pair.png" alt="쿠옹이와 쿠밍이" class="crisp bob" style="width: 190px; height: auto">
    </div>

    <div class="panel" style="padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div role="tablist" aria-label="이용자 유형" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button role="tab" aria-selected="{{isUser}}" onClick="{{asUser}}" class="{{userCls}}" style="height: 40px; font-family: inherit; font-size: 14px; font-weight: 700">민원인</button>
        <button role="tab" aria-selected="{{isStaff}}" onClick="{{asStaff}}" class="{{staffCls}}" style="height: 40px; font-family: inherit; font-size: 14px; font-weight: 700">직원(담당자)</button>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 700">ID(아이디)
        <input type="text" placeholder="학번 또는 아이디" class="slot" style="height: 42px; box-sizing: border-box; padding: 0 10px; font-size: 14px; font-family: inherit; color: #3A2617">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 700">PW(비밀번호)
        <input type="password" placeholder="비밀번호" class="slot" style="height: 42px; box-sizing: border-box; padding: 0 10px; font-size: 14px; font-family: inherit; color: #3A2617">
      </label>
      <a href="{{target}}" class="btn" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">{{cta}}</a>
      <a href="{{target}}" class="btn3" style="height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px">
        <svg width="16" height="16" viewBox="0 0 6 6" shape-rendering="crispEdges"><rect x="1" y="0" width="4" height="1" fill="#D2483A"></rect><rect x="0" y="1" width="1" height="4" fill="#E0A82E"></rect><rect x="1" y="5" width="4" height="1" fill="#3E8C47"></rect><rect x="5" y="3" width="1" height="2" fill="#3B6FC2"></rect><rect x="3" y="3" width="2" height="1" fill="#3B6FC2"></rect></svg>
        구글로 이용하기
      </a>
      <div style="display: flex; justify-content: center; gap: 14px; font-size: 11px"><a href="#" style="color: #6A4E36">회원가입</a><a href="#" style="color: #6A4E36">아이디 찾기</a><a href="#" style="color: #6A4E36">비밀번호 찾기</a></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { role: 'user' }; }
  renderVals() {
    const u = this.state.role === 'user';
    return {
      isUser: u, isStaff: !u, userCls: u ? 'btn2' : 'btn3', staffCls: u ? 'btn3' : 'btn2',
      target: u ? 'Main.dc.html' : 'AdminDashboard.dc.html',
      cta: u ? '모험 시작하기' : '담당자 로그인',
      asUser: () => this.setState({ role: 'user' }),
      asStaff: () => this.setState({ role: 'staff' })
    };
  }
}
</script>
</body>
</html>
