<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경희대 키우기 꾸미기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Galmuri11';src:url(../assets/fonts/Galmuri11.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Galmuri11';src:url(../assets/fonts/Galmuri11-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{margin:0}
a{color:#7E2219}a:hover{color:#5E1A13}
*{-webkit-font-smoothing:none}
.crisp{image-rendering:pixelated}
.panel{background:#F6EBCF;border:3px solid #3A2617;box-shadow:inset 0 0 0 2px #FFF7E2,inset 0 0 0 4px #D9C08E,4px 4px 0 rgba(58,38,23,.45)}
.plate{background:#8A5A33;color:#FFF3D6;border:3px solid #3A2617;box-shadow:inset 0 2px 0 #B07A48,inset 0 -3px 0 #5E3B20}
.btn{background:#B23A2E;color:#FFF6E6;border:3px solid #3A2617;box-shadow:inset 0 3px 0 #D9644F,inset 0 -4px 0 #7E2219,3px 3px 0 rgba(58,38,23,.45);cursor:pointer;text-decoration:none}
.btn2{background:#6E9A34;color:#FFFBEA;border:3px solid #3A2617;box-shadow:inset 0 3px 0 #94BF4E,inset 0 -4px 0 #4A6D20,3px 3px 0 rgba(58,38,23,.45);cursor:pointer;text-decoration:none}
.btn3{background:#EAD9AE;color:#3A2617;border:3px solid #3A2617;box-shadow:inset 0 3px 0 #FFF4D2,inset 0 -4px 0 #C2A66C,3px 3px 0 rgba(58,38,23,.45);cursor:pointer;text-decoration:none}
.btn:active,.btn2:active,.btn3:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.15)}
.slot{background:#E9D9B0;border:3px solid #3A2617;box-shadow:inset 3px 3px 0 #C9AF77}
input:focus,textarea:focus{outline:3px solid #E8B64A;outline-offset:0}
@media (prefers-reduced-motion: no-preference){
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.walk{transition:left .6s steps(6),top .6s steps(6)}
.bar{width:0;animation:fill 1.6s steps(8) forwards}
@keyframes fill{to{width:100%}}
}
@media (prefers-reduced-motion: reduce){.bar{width:100%}}
</style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Galmuri11', monospace; color: #3A2617; background: #6F8F2C">
  <img src="../assets/campus_map.jpg" alt="" class="crisp" style="position: absolute; left: -300px; top: -380px; width: 800px; height: 1000px">
  <div style="position: absolute; inset: 0; background: rgba(58,38,23,.35)"></div>

  <header class="panel" style="position: relative; z-index: 2; margin: 10px 10px 0; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px">
    <a href="Main.dc.html" aria-label="지도로 돌아가기" class="btn3" style="width: 40px; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 10 10" shape-rendering="crispEdges" fill="#3A2617"><rect x="5" y="1" width="1" height="1"></rect><rect x="4" y="2" width="1" height="1"></rect><rect x="3" y="3" width="1" height="1"></rect><rect x="2" y="4" width="6" height="2"></rect><rect x="3" y="6" width="1" height="1"></rect><rect x="4" y="7" width="1" height="1"></rect><rect x="5" y="8" width="1" height="1"></rect></svg>
    </a>
    <span style="font-weight: 700; font-size: 16px">꾸미기</span>
    <span class="plate" style="font-size: 11px; padding: 3px 8px">광장</span>
    <button onClick="{{askReset}}" class="btn3" style="margin-left: auto; height: 36px; padding: 0 10px; font-family: inherit; font-size: 11px; font-weight: 700">초기화</button>
  </header>

  <div style="position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 12px">
    <div class="panel" style="padding: 8px; position: relative">
      <div style="position: relative; border: 3px solid #3A2617; overflow: hidden">
        <img src="{{img}}" alt="{{imgAlt}}" class="crisp" style="display: block; width: 100%; height: 208px; object-fit: cover">
        <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; background: rgba(58,38,23,.75); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #FFF3D6">
            <img src="../assets/kuming.png" alt="" class="crisp bob" style="width: 52px; height: auto">
            <span style="font-weight: 700; font-size: 16px; color: #FFE8A8">경희대를 꾸미는중...</span>
            <div style="width: 200px; height: 18px; border: 2px solid #FFF3D6; padding: 2px; box-sizing: border-box"><div class="bar" style="height: 100%; background: #8DBF3E"></div></div>
          </div>
        </sc-if>
      </div>
      <div role="tablist" aria-label="비교" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
        <button role="tab" aria-selected="{{isBefore}}" onClick="{{showBefore}}" class="{{beforeCls}}" style="height: 36px; font-family: inherit; font-size: 14px; font-weight: 700">꾸미기 전</button>
        <button role="tab" aria-selected="{{isAfter}}" onClick="{{showAfter}}" class="{{afterCls}}" style="height: 36px; font-family: inherit; font-size: 14px; font-weight: 700">꾸민 후</button>
      </div>
    </div>

    <sc-if value="{{done}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button onClick="{{save}}" class="btn2" style="height: 46px; font-family: inherit; font-size: 14px; font-weight: 700">{{saveLabel}}</button>
        <button onClick="{{edit}}" class="btn3" style="height: 46px; font-family: inherit; font-size: 14px; font-weight: 700">수정하기</button>
      </div>
    </sc-if>

    <div class="panel" style="padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px">이 자리를 어떻게 바꾸고 싶나요?
        <textarea value="{{prompt}}" onChange="{{onPrompt}}" placeholder="예: 분수대 주변에 벤치 생성" class="slot" style="height: 56px; resize: none; padding: 8px; font-family: inherit; font-size: 14px; font-weight: 400; color: #3A2617"></textarea>
      </label>
      <button onClick="{{generate}}" class="btn" style="height: 46px; font-family: inherit; font-size: 16px; font-weight: 700">AI로 생성하기</button>
      <span style="font-size: 11px; color: #6A4E36; line-height: 1.5">생성한 모습은 건의사항으로 담당 부서에 함께 전달돼요.</span>
    </div>

    <div class="panel" style="padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 700; font-size: 16px">히스토리</span>
      <sc-for list="{{history}}" as="h" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; padding: 6px; background: #FFF7E2; border: 2px solid #3A2617">
          <div class="slot" style="width: 56px; height: 40px; overflow: hidden; flex-shrink: 0"><img src="../assets/deco_after.png" alt="" class="crisp" style="width: 100%; height: 100%; object-fit: cover"></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px">{{h.title}}</span>
            <span style="font-size: 11px; color: #6A4E36">{{h.date}}</span>
          </div>
          <button onClick="{{h.del}}" class="btn3" style="height: 34px; padding: 0 10px; font-family: inherit; font-size: 11px">삭제</button>
        </div>
      </sc-for>
      <sc-if value="{{noHistory}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 14px; color: #6A4E36">아직 꾸민 기록이 없어요. 위에서 첫 꾸미기를 만들어보세요.</span>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 5; background: rgba(58,38,23,.6); display: flex; align-items: center; justify-content: center; padding: 24px">
      <div role="dialog" aria-label="초기화 확인" class="panel" style="padding: 20px; display: flex; flex-direction: column; gap: 14px; text-align: center; width: 100%">
        <span style="font-weight: 700; font-size: 16px">정말로 초기화하시겠습니까?</span>
        <span style="font-size: 14px; color: #6A4E36">내가 꾸민 오브젝트가 모두 사라져요.</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button onClick="{{cancelReset}}" class="btn3" style="height: 44px; font-family: inherit; font-size: 14px">취소</button>
          <button onClick="{{doReset}}" class="btn" style="height: 44px; font-family: inherit; font-size: 14px; font-weight: 700">초기화</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { step: 'done', after: true, saved: false, confirm: false, prompt: '분수대 주변에 벤치 생성', history: [
      { title: '분수대 주변 꽃 화단 생성', date: '2026.10.02' },
      { title: '분수대 벤치 생성', date: '2026.10.02' }
    ] };
  }
  renderVals() {
    const s = this.state;
    const after = s.after && s.step !== 'input';
    return {
      img: after ? '../assets/deco_after.png' : '../assets/deco_before.png',
      imgAlt: after ? '꾸민 후: 벤치와 화단이 생긴 광장' : '꾸미기 전 광장',
      isBefore: !after, isAfter: after, beforeCls: after ? 'btn3' : 'btn2', afterCls: after ? 'btn2' : 'btn3',
      showBefore: () => this.setState({ after: false }), showAfter: () => this.setState({ after: true }),
      loading: s.step === 'loading', done: s.step === 'done', confirm: s.confirm,
      saveLabel: s.saved ? '저장됨' : '저장',
      prompt: s.prompt, onPrompt: (e) => this.setState({ prompt: e.target.value }),
      generate: () => { this.setState({ step: 'loading', after: true, saved: false }); setTimeout(() => this.setState({ step: 'done' }), 1800); },
      save: () => {
        if (s.saved) return;
        const d = new Date();
        const date = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
        this.setState({ saved: true, history: [{ title: s.prompt || '새 꾸미기', date }].concat(s.history) });
      },
      edit: () => this.setState({ step: 'input', after: false }),
      history: s.history.map((h, i) => ({ ...h, del: () => this.setState({ history: s.history.filter((_, j) => j !== i) }) })),
      noHistory: s.history.length === 0,
      askReset: () => this.setState({ confirm: true }), cancelReset: () => this.setState({ confirm: false }),
      doReset: () => this.setState({ confirm: false, step: 'input', after: false, history: [], saved: false })
    };
  }
}
</script>
</body>
</html>
